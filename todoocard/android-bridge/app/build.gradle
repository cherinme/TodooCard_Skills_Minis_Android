plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.jiqimaooo.todoocard.androidbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.jiqimaooo.todoocard.androidbridge'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
